aid: algebras-ai-inc
name: Algebras AI Inc.
description: >-
  Algebras AI is an AI-powered localization platform that translates UI, video, and audio
  content into 300+ languages with agentic translation, glossary-aware quality, and voice/video
  dubbing with lip-sync. The Algebras API (OpenAPI 3.0, API-key auth via the X-Api-Key header)
  exposes text, batch, and agentic translation, translation fluency evaluation, glossaries and
  terms, localization tables, language detection, video translation, storage upload URLs, and
  real-time streaming rooms with RTMP ingress/egress. First-party tooling includes a Python CLI,
  a Unity SDK, a Next.js integration, a locale-checker GitHub Action, a hosted MCP server, and a
  published agent skill. Algebras AI was surfaced as a 500 Global portfolio company.
